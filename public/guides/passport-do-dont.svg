      <circle cx="138" cy="52" r="3" fill="#111214"/><circle cx="170" cy="52" r="3" fill="#111214"/>
    </g>
    <circle cx="182" cy="30" r="10" fill="#DC2626"/><path d="M178 26l8 8M186 26l-8 8" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="168" x2="186" y2="168" stroke="#DCDCD5" stroke-width="1.2"/>
    <circle cx="56" cy="170" r="7" fill="#15803D"/><circle cx="154" cy="170" r="7" fill="#DC2626"/>
