    <circle cx="56" cy="170" r="7" fill="#15803D"/><circle cx="154" cy="170" r="7" fill="#DC2626"/>
  </g>

  <!-- Pair 2: Straight Head vs Tilted / Smiling Teeth -->
  <g transform="translate(242,16)">
    <rect width="210" height="198" rx="6" fill="#FFFFFF" stroke="#DCDCD5" stroke-width="1.4"/>
    <rect x="12" y="18" width="88" height="122" rx="4" fill="#F8FAFC" stroke="#15803D" stroke-width="1.8"/>
    <circle cx="56" cy="68" r="22" fill="#FDE6D8" stroke="#111214" stroke-width="1.4"/>
