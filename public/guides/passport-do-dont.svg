    <circle cx="84" cy="30" r="10" fill="#15803D"/><path d="M79 30l3.5 3.5 6.5-6.5" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>

    <rect x="110" y="18" width="88" height="122" rx="4" fill="#F8FAFC" stroke="#DC2626" stroke-width="1.8"/>
    <g transform="rotate(18 154 70)">
      <circle cx="154" cy="68" r="22" fill="#FDE6D8" stroke="#111214" stroke-width="1.4"/>
      <circle cx="146" cy="65" r="2" fill="#111214"/><circle cx="162" cy="65" r="2" fill="#111214"/>
      <path d="M144 76c5 7 15 7 20 0z" fill="#FFFFFF" stroke="#111214" stroke-width="1.2"/>
