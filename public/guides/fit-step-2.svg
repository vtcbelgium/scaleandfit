  <path d="M304 111h-26M286 105l-8 6 8 6" fill="none" stroke="#15803D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="144" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" fill="#0F52BA">85.6 mm</text>
  <circle cx="326" cy="36" r="14" fill="#15803D"/>
  <path d="M319 36l4.5 4.5 9.5-9.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
