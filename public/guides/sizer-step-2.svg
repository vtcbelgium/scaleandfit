<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Carry-on suitcase including wheels and handle fitting inside airline sizer cage">
  <rect width="360" height="220" rx="8" fill="#FAFAF8"/>
  <!-- Outer Airline Metal Sizer Cage -->
  <rect x="86" y="34" width="136" height="156" rx="4" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- Top luggage handle & suitcase body inside -->
  <path d="M134 52v-12h40v12" fill="none" stroke="#0F52BA" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="104" y="52" width="100" height="120" rx="8" fill="rgba(21,128,61,0.12)" stroke="#15803D" stroke-width="2.2"/>
  <line x1="126" y1="68" x2="126" y2="156" stroke="#15803D" stroke-width="1.3" opacity="0.5"/>
  <line x1="154" y1="68" x2="154" y2="156" stroke="#15803D" stroke-width="1.3" opacity="0.5"/>
  <line x1="182" y1="68" x2="182" y2="156" stroke="#15803D" stroke-width="1.3" opacity="0.5"/>
  <!-- Spinner wheels clearly included inside cage -->
  <circle cx="122" cy="180" r="7" fill="#334155"/>
  <circle cx="186" cy="180" r="7" fill="#334155"/>
  <!-- Dimension ticks on right -->
  <g stroke="#0F52BA" stroke-width="1.4">
    <line x1="238" y1="40" x2="238" y2="187"/>
    <line x1="232" y1="40" x2="244" y2="40"/>
    <line x1="232" y1="187" x2="244" y2="187"/>
  </g>
  <text x="250" y="118" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" fill="#0F52BA">cm / in</text>
  <circle cx="326" cy="36" r="14" fill="#15803D"/>
  <path d="M319 36l4.5 4.5 9.5-9.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
