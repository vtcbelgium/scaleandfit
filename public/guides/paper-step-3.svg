<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Set printer dialog scale to 100% actual size and avoid Fit to Page shrinkage">
  <rect width="360" height="220" rx="8" fill="#FAFAF8"/>
  <!-- Printer Icon + Dialog Box -->
  <rect x="30" y="24" width="168" height="172" rx="8" fill="#FFFFFF" stroke="#111214" stroke-width="1.6"/>
  <rect x="44" y="42" width="140" height="54" rx="6" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <text x="72" y="76" font-family="ui-monospace,Consolas,monospace" font-size="22" font-weight="700" fill="#15803D">100%</text>
  <circle cx="158" cy="69" r="14" fill="#15803D"/>
  <path d="M151 69l4.5 4.5 9.5-9.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="44" y="114" width="140" height="54" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8" opacity="0.85"/>
  <text x="72" y="148" font-family="ui-monospace,Consolas,monospace" font-size="22" font-weight="700" fill="#DC2626" text-decoration="line-through">94%</text>
  <circle cx="158" cy="141" r="14" fill="#DC2626"/>
  <path d="M152 135l12 12M164 135l-12 12" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Physical Ruler Check beside Print Dialog -->
  <rect x="220" y="34" width="112" height="152" rx="6" fill="#FFFFFF" stroke="#111214" stroke-width="1.5"/>
  <rect x="234" y="54" width="84" height="28" rx="3" fill="rgba(15,82,186,0.08)" stroke="#0F52BA" stroke-width="1.4"/>
  <rect x="234" y="96" width="84" height="28" rx="3" fill="rgba(15,82,186,0.08)" stroke="#0F52BA" stroke-width="1.4"/>
  <rect x="234" y="138" width="84" height="28" rx="3" fill="rgba(15,82,186,0.08)" stroke="#0F52BA" stroke-width="1.4"/>
  <!-- Crosshair alignment check -->
  <path d="M276 46v128M226 110h100" stroke="#D9381E" stroke-width="1.3" stroke-dasharray="4 3"/>
</svg>
