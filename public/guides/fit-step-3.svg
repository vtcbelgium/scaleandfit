<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Align the red circle with the inside wall of your ring, not the outside band">
  <rect width="360" height="220" rx="8" fill="#FAFAF8"/>
  <!-- Crosshair Reticle Stage -->
  <rect x="28" y="22" width="184" height="176" rx="8" fill="#FFFFFF" stroke="#DCDCD5" stroke-width="1.4"/>
  <line x1="120" y1="36" x2="120" y2="184" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="44" y1="110" x2="196" y2="110" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- Gold Metal Ring Band (outer + inner) -->
  <circle cx="120" cy="110" r="52" fill="none" stroke="#D97706" stroke-width="14"/>
  <circle cx="120" cy="110" r="59" fill="none" stroke="#92400E" stroke-width="1.3"/>
  <!-- Red Inner Diameter Match Circle -->
  <circle cx="120" cy="110" r="45" fill="rgba(217,56,30,0.10)" stroke="#D9381E" stroke-width="3"/>
  <!-- Zoomed Magnifier Explanation on Right -->
  <rect x="228" y="34" width="108" height="152" rx="8" fill="#FFFFFF" stroke="#111214" stroke-width="1.5"/>
  <!-- Section of Ring Wall in Magnifier -->
  <path d="M250 156c8-36 16-66 16-94h22c0 28-8 58-16 94z" fill="#FDE68A" stroke="#92400E" stroke-width="1.5"/>
  <line x1="250" y1="156" x2="266" y2="62" stroke="#D9381E" stroke-width="3"/>
  <!-- Green Check pointing to Inner Wall -->
  <circle cx="244" cy="96" r="11" fill="#15803D"/>
  <path d="M239 96l3 3 7-7" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
  <!-- Red X pointing to Outer Wall -->
  <circle cx="312" cy="96" r="11" fill="#DC2626"/>
  <path d="M307 91l10 10M317 91l-10 10" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
  <text x="282" y="174" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" fill="#111214">18.9 mm</text>
</svg>
