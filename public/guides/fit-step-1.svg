<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Stand heel against wall on paper and mark longest toe in millimeters">
  <rect width="360" height="220" rx="8" fill="#FAFAF8"/>
  <!-- Wall on left + floor line -->
  <rect x="26" y="20" width="18" height="152" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
  <line x1="26" y1="172" x2="334" y2="172" stroke="#111214" stroke-width="2"/>
  <!-- Sheet of white paper -->
  <rect x="44" y="160" width="246" height="12" fill="#FFFFFF" stroke="#0F52BA" stroke-width="1.3"/>
  <!-- Foot profile with heel flush against wall -->
  <path d="M46 158c0-26 6-52 16-66h34l18 40c24 8 68 12 104 12 22 0 36 6 36 14H46z" fill="#FDE6D8" stroke="#111214" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Pencil marking longest toe -->
  <line x1="254" y1="88" x2="254" y2="158" stroke="#D9381E" stroke-width="2" stroke-dasharray="4 3"/>
  <g transform="rotate(20 264 112)">
    <rect x="256" y="64" width="10" height="58" rx="2" fill="#F59E0B" stroke="#111214" stroke-width="1.3"/>
    <polygon points="256,122 266,122 261,134" fill="#111214"/>
  </g>
  <!-- Millimeter Ruler Measurement Arrow -->
  <g stroke="#0F52BA" stroke-width="2">
    <line x1="44" y1="194" x2="254" y2="194"/>
    <line x1="44" y1="186" x2="44" y2="202"/>
    <line x1="254" y1="186" x2="254" y2="202"/>
  </g>
  <text x="149" y="210" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11.5" font-weight="700" fill="#0F52BA">265 mm / 26.5 cm</text>
</svg>
