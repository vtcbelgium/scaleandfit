<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Overlapping TV sizes compared above a console and sofa distance arrow">
  <rect width="360" height="220" rx="8" fill="#FAFAF8"/>
  <!-- Overlapping 65" (Red) & 55" (Blue) Screens -->
  <rect x="64" y="24" width="212" height="118" rx="3" fill="rgba(217,56,30,0.08)" stroke="#D9381E" stroke-width="2"/>
  <rect x="64" y="42" width="176" height="100" rx="3" fill="rgba(15,82,186,0.12)" stroke="#0F52BA" stroke-width="2"/>
  <text x="152" y="96" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" fill="#0F52BA">55"</text>
  <text x="256" y="44" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" fill="#D9381E">65"</text>
  <!-- Media Console -->
  <rect x="44" y="152" width="252" height="24" rx="3" fill="#E6E6E0" stroke="#64748B" stroke-width="1.4"/>
  <line x1="58" y1="176" x2="58" y2="188" stroke="#64748B" stroke-width="2.4"/>
  <line x1="282" y1="176" x2="282" y2="188" stroke="#64748B" stroke-width="2.4"/>
  <!-- Viewing Distance Dimension Line -->
  <line x1="44" y1="202" x2="316" y2="202" stroke="#0F52BA" stroke-width="1.5"/>
  <path d="M52 197l-8 5 8 5M308 197l8 5-8 5" fill="none" stroke="#0F52BA" stroke-width="1.5" stroke-linecap="round"/>
  <text x="180" y="196" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="10.5" fill="#475569">2.3 m / 7.5 ft</text>
  <circle cx="326" cy="36" r="14" fill="#15803D"/>
  <path d="M319 36l4.5 4.5 9.5-9.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
