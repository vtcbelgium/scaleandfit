<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Three printable sheets: dot grid, monthly calendar, and Avery label sheet in A4 and US Letter">
  <rect width="360" height="220" rx="8" fill="#FAFAF8"/>
  <!-- Sheet 1: Dot Grid -->
  <rect x="26" y="28" width="90" height="128" rx="4" fill="#FFFFFF" stroke="#111214" stroke-width="1.5"/>
  <g fill="#0F52BA" opacity="0.7">
    <circle cx="42" cy="48" r="1.4"/><circle cx="56" cy="48" r="1.4"/><circle cx="70" cy="48" r="1.4"/><circle cx="84" cy="48" r="1.4"/><circle cx="98" cy="48" r="1.4"/>
    <circle cx="42" cy="64" r="1.4"/><circle cx="56" cy="64" r="1.4"/><circle cx="70" cy="64" r="1.4"/><circle cx="84" cy="64" r="1.4"/><circle cx="98" cy="64" r="1.4"/>
    <circle cx="42" cy="80" r="1.4"/><circle cx="56" cy="80" r="1.4"/><circle cx="70" cy="80" r="1.4"/><circle cx="84" cy="80" r="1.4"/><circle cx="98" cy="80" r="1.4"/>
    <circle cx="42" cy="96" r="1.4"/><circle cx="56" cy="96" r="1.4"/><circle cx="70" cy="96" r="1.4"/><circle cx="84" cy="96" r="1.4"/><circle cx="98" cy="96" r="1.4"/>
    <circle cx="42" cy="112" r="1.4"/><circle cx="56" cy="112" r="1.4"/><circle cx="70" cy="112" r="1.4"/><circle cx="84" cy="112" r="1.4"/><circle cx="98" cy="112" r="1.4"/>
    <circle cx="42" cy="128" r="1.4"/><circle cx="56" cy="128" r="1.4"/><circle cx="70" cy="128" r="1.4"/><circle cx="84" cy="128" r="1.4"/><circle cx="98" cy="128" r="1.4"/>
  </g>
  <!-- Sheet 2: Monthly Calendar Grid -->
  <rect x="135" y="28" width="90" height="128" rx="4" fill="#FFFFFF" stroke="#111214" stroke-width="1.5"/>
  <rect x="143" y="38" width="74" height="14" rx="2" fill="#0F52BA"/>
  <g stroke="#CBD5E1" stroke-width="1" fill="none">
    <rect x="143" y="58" width="74" height="86"/>
    <line x1="168" y1="58" x2="168" y2="144"/>
    <line x1="192" y1="58" x2="192" y2="144"/>
    <line x1="143" y1="86" x2="217" y2="86"/>
    <line x1="143" y1="115" x2="217" y2="115"/>
  </g>
  <rect x="169" y="87" width="22" height="27" fill="rgba(217,56,30,0.18)"/>
  <!-- Sheet 3: Die-Cut Labels -->
  <rect x="244" y="28" width="90" height="128" rx="4" fill="#FFFFFF" stroke="#111214" stroke-width="1.5"/>
  <g stroke="#0F52BA" stroke-width="1" fill="rgba(15,82,186,0.06)">
    <rect x="252" y="40" width="33" height="20" rx="2"/><rect x="293" y="40" width="33" height="20" rx="2"/>
    <rect x="252" y="68" width="33" height="20" rx="2"/><rect x="293" y="68" width="33" height="20" rx="2"/>
    <rect x="252" y="96" width="33" height="20" rx="2"/><rect x="293" y="96" width="33" height="20" rx="2"/>
    <rect x="252" y="124" width="33" height="20" rx="2"/><rect x="293" y="124" width="33" height="20" rx="2"/>
  </g>
  <!-- Bottom Format Pill -->
  <rect x="116" y="172" width="128" height="26" rx="13" fill="#EFF6FF" stroke="#0F52BA" stroke-width="1.4"/>
  <text x="180" y="189" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11.5" font-weight="700" fill="#0F52BA">A4 / US PDF</text>
</svg>
