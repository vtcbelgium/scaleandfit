<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Download single digital photo or 4x6 printable sheet with trim lines">
  <rect width="360" height="220" rx="8" fill="#FAFAF8"/>
  <!-- 4x6 Photo Sheet -->
  <rect x="34" y="26" width="232" height="162" rx="6" fill="#FFFFFF" stroke="#111214" stroke-width="1.6"/>
  <!-- 6 Mini Portraits (3x2) -->
  <g stroke="#94A3B8" stroke-dasharray="3 2" stroke-width="1">
    <rect x="48" y="38" width="58" height="64" fill="#F8FAFC"/>
    <rect x="120" y="38" width="58" height="64" fill="#F8FAFC"/>
    <rect x="192" y="38" width="58" height="64" fill="#F8FAFC"/>
    <rect x="48" y="112" width="58" height="64" fill="#F8FAFC"/>
    <rect x="120" y="112" width="58" height="64" fill="#F8FAFC"/>
    <rect x="192" y="112" width="58" height="64" fill="#F8FAFC"/>
  </g>
  <!-- Repeating Head Icons -->
  <g fill="#64748B">
    <circle cx="77" cy="64" r="11"/><path d="M60 100c2-11 9-16 17-16s15 5 17 16z"/>
    <circle cx="149" cy="64" r="11"/><path d="M132 100c2-11 9-16 17-16s15 5 17 16z"/>
    <circle cx="221" cy="64" r="11"/><path d="M204 100c2-11 9-16 17-16s15 5 17 16z"/>
    <circle cx="77" cy="138" r="11"/><path d="M60 174c2-11 9-16 17-16s15 5 17 16z"/>
    <circle cx="149" cy="138" r="11"/><path d="M132 174c2-11 9-16 17-16s15 5 17 16z"/>
    <circle cx="221" cy="138" r="11"/><path d="M204 174c2-11 9-16 17-16s15 5 17 16z"/>
  </g>
  <!-- Vermilion cut dashed line & scissors icon -->
  <line x1="113" y1="30" x2="113" y2="184" stroke="#D9381E" stroke-width="1.5" stroke-dasharray="5 3"/>
  <g transform="translate(278,108)" fill="none" stroke="#111214" stroke-width="2">
    <circle cx="14" cy="14" r="8" stroke="#0F52BA"/>
    <circle cx="14" cy="40" r="8" stroke="#0F52BA"/>
    <line x1="21" y1="18" x2="46" y2="35" stroke-linecap="round"/>
    <line x1="21" y1="36" x2="46" y2="19" stroke-linecap="round"/>
  </g>
  <!-- 4x6 badge & checkmark -->
  <rect x="278" y="28" width="60" height="24" rx="4" fill="#EFF6FF" stroke="#0F52BA" stroke-width="1.4"/>
  <text x="308" y="44" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" fill="#0F52BA">4×6"</text>
  <circle cx="324" cy="184" r="14" fill="#15803D"/>
  <path d="M317 184l4.5 4.5 9.5-9.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
